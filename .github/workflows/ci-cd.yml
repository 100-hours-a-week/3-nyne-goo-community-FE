name: Node.js CI/CD

on:
  push:
    branches: [develop, main]
  pull_request:
    branches:
      - develop

jobs:
  # 테스트
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [19.x, 20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install
      
      - name: Run tests
        run: npm test

  # CI: build docker image and push to s3
  build-and-push-image:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'   # 우선 develop 브랜치에 push 될 때만

    env:
      AWS_REGION: ap-northeast-2
      ECR_REPOSITORY: dorandoran-fe
      CODEDEPLOY_APPLOCATION_NAME: dorandoran-fe-CD-app
      CODEDEPLOY_DEPLOYMENT_GROUP: dorandoran-fe-CD-group
      S3_BUCKET: dorandoran-s3-bucket

    steps:
      - uses: actions/checkout@v4

      # AWS 자격 증명 설정
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      # ECR 로그인
      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # build and push
      - name: Build, tag and push image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
          IMAGE_TAG: latest
        run: |
          echo "ECR_REGISTRY=$ECR_REGISTRY"
          docker build -t $ECR_REPOSITORY:$IMAGE_TAG --platform linux/amd64 --no-cache .
          docker tag $ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # create zip (appspec.yml, scripts/)
      - name: Zip codeDeploy bundle
        run: |
          zip -r deploy.zip appspec.yml scripts/

      # upload to S3
      - name: Upload bundle to S3
        run: |
          aws s3 cp deploy.zip s3://$S3_BUCKET/frontend/deploy-${GITHUB_SHA}.zip

      # CodeDeploy 배포 생성
      - name: Create CodeDeploy deployment
        run: |
          aws deploy create-deployment \
            --application-name $CODEDEPLOY_APPLOCATION_NAME \
            --deployment-group-name $CODEDEPLOY_DEPLOYMENT_GROUP \
            --s3-location bucket=$S3_BUCKET,key=frontend/deploy-${GITHUB_SHA}.zip,bundleType=zip \
            --region $AWS_REGION
