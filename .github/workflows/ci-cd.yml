name: Node.js CI/CD

on:
  push:
    branches: [develop, main]
  pull_request:
    branches:
      - develop

jobs:
  # 1. 테스트
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [19.x, 20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install
      
      - name: Run tests
        run: npm test

  # 2. CI: build docker image and push to docker hub
  build-and-push-image:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'   # 우선 develop 브랜치에 push 될 때만

    steps:
      - uses: actions/checkout@v4
      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Build and Push Docker Image
        run: |
          docker build --platform linux/amd64 -t ${{ secrets.DOCKER_USERNAME }}/dorandoran-fe:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/dorandoran-fe:latest

  deploy:
    needs: build-and-push-image
    runs-on: self-hosted

    steps:
      # actions-runner 권한 부여
      - name: change permission
        run: sudo chown -R ubuntu:ubuntu /home/ubuntu

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.FE_SSH_KEY }}" > ~/.ssh/dorandoran-fe.pem
          chmod 600 ~/.ssh/dorandoran-fe.pem
          ssh-keyscan -H ${{ secrets.FE_SSH_HOST }} >> ~/.ssh/known_hosts
      - name: Check if Docker is installed
        id: check-docker 
        run: |
          DOCKER_EXISTS=$(ssh -i ~/.ssh/dorandoran-fe.pem -o StrictHostKeyChecking=no ${{ secrets.FE_SSH_USER }}@${{ secrets.FE_SSH_HOST }} 'command -v docker >/dev/null & echo "true" || echo "false" ')
          echo "docker_exists=$DOCKER_EXISTS" >> $GITHUB_OUTPUT

      - name: Check if Node.js is installed
        id: check-nodejs
        run: |
          NODE_EXISTS=$(ssh -i ~/.ssh/dorandoran-fe.pem -o StrictHostKeyChecking=no ${{ secrets.FE_SSH_USER}}@${{ secrets.FE_SSH_HOST }} 'command -v node >/dev/null && echo "true" || echo "false" ')
          echo "node_exists=$NODE_EXISTS" >> $GITHUB_OUTPUT

      - name: Install Docker on EC2
        if: steps.check-docker.outputs.docker_exists == 'false'
        run: |
          ssh -i  ~/.ssh/dorandoran-fe.pem -o StrictHostKeyChecking=no ${{ secrets.FE_SSH_USER }}@${{ secrets.FE_SSH_HOST }} << 'EOF'
            sudo apt-get update
            sudo apt-get install -y ca-certificates curl gnupg lsb-release
            sudo mkdir -p /etc/apt/keyrings
            curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] \
              https://download.docker.com/linux/ubuntu \
              $(lsb_release -cs) stable" \
              | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
            sudo apt-get update
            sudo apt-get insall -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
            sudo usermod -aG docker ${{ secrets.FE_SSH_USER }}
          EOF

      - name: Install Node.js on EC2
        if: steps.check-nodejs.outputs.node_exists == 'false'
        run: |
          ssh -i ~/.ssh/dorandoran-fe.pem -o StrictHostKeyChecking=no ${{ secrets.FE_SSH_USER }}@${{ secrets.FE_SSH_HOST }} << 'EOF'
            curl -fsSL https://deb.nodesource.com/setup_lts.x | sudo -E bash -
            sudo apt-get install -y nodejs
          EOF

      - name: Deploy to fe server via Docker Compose
        run: |
          ssh -i ~/.ssh/dorandoran-fe.pem -o StrictHostKeyChecking=no ${{ secrets.FE_SSH_USER }}@${{ secrets.FE_SSH_HOST }} << 'EOF'
            cd /home/${{ secrets.FE_SSH_USER }}/dorandoran-fe
            sudo docker compose pull 
            sudo docker compose up -d
          EOF
