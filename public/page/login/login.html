<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>도란도란</title>
  <link rel="stylesheet" href="/page/login/login.css" />
</head>
<body>
  <!-- 인트로 섹션 -->
  <section class="intro">
    <div class="logo-container">
      <h1 class="logo-text">도란도란</h1>
      <p class="sub-text">Where Connections Flow</p>
    </div>
  </section>

  <!-- 로그인 섹션 -->
<section class="login-section" id="loginSection">
    <div class="login-box">
      <h2>로그인</h2>
      <form id="loginForm" class="login-form">
        <input id="email" type="email" placeholder="이메일" required />
        <span class="error-msg" id="emailError"></span>

        <input id="password" type="password" placeholder="비밀번호" required />
        <span class="error-msg" id="passwordError"></span>

        <button type="submit" class="btn login-btn">로그인</button>

        <p class="login-error" id="loginError"></p>
      </form>

      <button class="btn-text signup-btn" id="signupBtn">회원가입</button>
    </div>
  </section>


  <script src="/config.js"></script>
  <script type="module" src="/page/login/login.js"></script>
</body>
</html>
