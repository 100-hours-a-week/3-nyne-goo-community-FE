<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>로그인 | 아무말 대잔치</title>
  <link rel="stylesheet" href="/common/css/common.css" />
  <link rel="stylesheet" href="/page/login/login.css" />
</head>

<body>
  <div id="wrap">
    <div id="header"></div>

    <main class="login-layout">
      <!-- ✅ 왼쪽 브랜드 섹션 -->
      <section class="login-left">
        <div class="brand-box">
          <h1>아무말 대잔치</h1>
          <p>가볍게 던지는 한마디가,<br>누군가의 공감이 되는 곳 💬</p>
        </div>
      </section>

      <!-- ✅ 오른쪽 로그인 카드 -->
      <section class="login-right">
        <div class="login-card">
          <h2>로그인</h2>
          <p class="sub-text">다시 만나서 반가워요 👋</p>

          <form id="loginForm" class="login-form">
            <div class="form-group">
              <label for="email">이메일</label>
              <input type="email" id="email" placeholder="이메일을 입력하세요" required />
              <p class="error-message" id="emailError"></p>
            </div>

            <div class="form-group">
              <label for="password">비밀번호</label>
              <div class="input-eye-group">
                <input type="password" id="password" placeholder="비밀번호를 입력하세요" required />
                <img
                  src="/assets/image/ic_eye_closed_black_64.png"
                  class="toggle-eye"
                  id="togglePassword"
                  alt="비밀번호 보기"
                />
              </div>
              <p class="error-message" id="passwordError"></p>
            </div>

            <button id="loginBtn" type="submit">로그인</button>
            <p class="error-message" id="loginError"></p>

            <div class="signup-link">
              <span>아직 회원이 아니신가요?</span>
              <button id="signupBtn" type="button">회원가입</button>
            </div>
          </form>
        </div>
      </section>
    </main>

    <div id="footer"></div>
  </div>

  <script src="/config.js"></script>
  <script type="module" src="/page/login/login.js"></script>
</body>
</html>
