<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>게시글 상세 | 아무말 대잔치</title>
    <link rel="stylesheet" href="/common/css/common.css">
    <link rel="stylesheet" href="/common/css/dialog.css">
    <link rel="stylesheet" href="/page/post_detail/post_detail.css">
</head>

<body>
    <div id="wrap">
        <div id="header"></div>

        <div id="container">
            <!-- 게시글 카드 전체 -->
            <div class="post-card">

                <!-- 게시글 헤더 -->
                <section class="post-header">
                    <h1 id="postTitle" class="post-title"></h1>

                    <div class="author-box">
                        <div class="author-info">
                            <img src="" id="profile" alt="작성자 프로필" class="author-img" />
                            <div class="author-meta">
                                <p id="postAuthorName" class="author-name"></p>
                                <p id="postDate" class="post-date"></p>
                            </div>
                        </div>

                        <div class="edit-btns" id="postEdit">
                            <button class="edit-btn">수정</button>
                            <button class="delete-btn">삭제</button>
                        </div>
                    </div>
                </section>

                <!-- 본문 -->
                <section class="post-body">
                    <div class="image-carousel">
                        <div class="image-list" id="imageList"></div>
                    </div>
                    <div class="text-content" id="postContent"></div>
                </section>

                <!-- 통계 -->
                <section class="post-stats">
                    <div class="stat like" id="likeBtn">
                        <img src="/assets/image/ic_heart_white_64.png" alt="좋아요" class="icon heart-icon"
                            id="heartIcon" />
                        <span id="likeCount">0</span>
                    </div>
                    <div class="stat">
                        <img src="/assets/image/ic_eye_white_64.png" alt="조회수" class="icon" />
                        <span id="viewCount">0</span>
                    </div>
                    <div class="stat">
                        <img src="/assets/image/ic_comment_white_64.png" alt="댓글" class="icon" />
                        <span id="commentCount">0</span>
                    </div>
                </section>

            </div>

            <!-- 댓글 입력 -->
            <section class="comment-section">
                <h3>💬 댓글</h3>
                <div class="comment-input-box">
                    <textarea id="commentInput" placeholder="댓글을 남겨주세요" rows="3" maxlength="500"></textarea>
                    <div class="comment-bottom">
                        <p id="count">0 / 500</p>
                        <button id="submitComment">등록</button>
                    </div>
                </div>

                <div class="comment-list" id="commentList"></div>
            </section>
        </div>

    </div>

    <!-- 삭제 모달 -->
    <div id="deleteDialog" class="dialog hidden">
        <div class="dialog-box">
            <p class="dialog-message">정말 삭제하시겠습니까?</p>
            <div class="dialog-buttons">
                <button id="confirmDeleteBtn" class="confirm-btn">삭제</button>
                <button id="cancelDeleteBtn" class="cancel-btn">취소</button>
            </div>
        </div>
    </div>
    <div id="footer"></div>

    <div id="toast" class="toast"></div>
    <script type="module" src="/page/post_detail/post_detail.js"></script>
    <script src="/config.js"></script>
</body>

</html>
