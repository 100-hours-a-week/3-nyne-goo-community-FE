<html>

<head>
    <meta charset="UTF-8">
    <title>아무말 대잔치</title>
    <link rel="stylesheet" href="/common/css/container.css">
    <link rel="stylesheet" href="/page/post_detail/post_detail.css">
</head>

<body>
    <div id="wrap">
        <div id="header"></div>
        <div id="container">
            <div class="title">
                <!-- 제목 -->
                <h2 id="postTitle"></h2>

                <div class="author">
                    <!-- 작성자 정보 -->
                    <div class="author-info">
                        <img src="" id="profile" alt="작성자 프로필" />
                        <div class="author-text">
                            <p id="postAuthorName" class="author-name"></p>
                            <p id="postDate" class="date"></p>
                        </div>
                    </div>
                    <!-- 수정, 삭제 버튼 -->
                    <div class="edit-btns" id="postEdit">
                        <button class="edit-btn">수정</button>
                        <button class="delete-btn">삭제</button>
                    </div>
                </div>
            </div>
            <hr>

            <div class="post-content">
                <div class="image-carousel">
                    <div class="image-list" id="imageList"></div>
                </div>

                <div class="text-content" id="postContent"></div>
            </div>

            <!-- 좋아요 / 조회수 / 댓글수 -->
            <div class="post-stats">
                <div class="stat like" id="likeBtn">
                    <img src="/assets/image/ic_heart_white_64.png" alt="좋아요" class="icon heart-icon" id="heartIcon" />
                    <span id="likeCount">23</span>
                </div>

                <div class="stat">
                    <img src="/assets/image/ic_eye_white_64.png" alt="조회수" class="icon" />
                    <span id="viewCount">102</span>
                </div>

                <div class="stat">
                    <img src="/assets/image/ic_comment_white_64.png" alt="댓글" class="icon" />
                    <span id="commentCount">5</span>
                </div>
            </div>



            <!-- 댓글 입력 -->
            <div class="comment-input-box">
                <textarea id="commentInput" placeholder="댓글을 남겨주세요" rows="3" maxlength="500"></textarea>
                <p id="count">0 / 500</p>
                <button id="submitComment">댓글 등록</button>
            </div>

            <!-- 댓글 리스트 -->
            <div class="comment-list" id="commentList"></div>
        </div>

    </div>
    </div>
    <script type="text/javascript" src="/page/post_detail/post_detail.js"></script>
    <script src="/config.js"></script>
</body>

</html>
