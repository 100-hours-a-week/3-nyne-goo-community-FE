<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
     <meta name="robots" content="noindex" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원정보수정 | 아무 말 대잔치</title>
    <link rel="stylesheet" href="/common/css/common.css">
    <link rel="stylesheet" href="/common/css/layout.css">
    <link rel="stylesheet" href="/page/my/my.css">
</head>

<body class="mypage">
    <div id="wrap">
        <div id="header"></div>

        <div id="container">
            <div class="mypage-box">
                <h2>마이페이지</h2>

                <!-- 프로필 -->
                <div class="profile-section">
                    <div class="profile-circle">
                        <img src="" alt="프로필 이미지" id="profileImg">
                        <button id="changeProfileBtn" class="change-btn">변경</button>
                        <input type="file" id="profileInput" accept="image/*" hidden>
                    </div>
                </div>

                <!-- 이메일, 닉네임 -->
                <div class="info-display">
                    <div class="info-row">
                        <p class="label">이메일</p>
                        <p class="value" id="emailValue"></p>
                    </div>

                    <div class="info-row">
                        <p class="label">닉네임</p>
                        <p class="value" id="nicknameValue"></p>
                    </div>
                </div>

                <div class="bottom-btns" id="bottomBtns">
                    <button id="saveBtn" class="save-btn">저장</button>
                    <button id="deleteBtn" class="delete-btn">회원탈퇴</button>
                </div>
            </div>
        </div>
    </div>

    <div id="deleteAlert" class="alert-overlay">
        <div class="alert-box">
            <p>정말 회원탈퇴 하시겠습니까?</p>
            <div class="alert-buttons">
                <button id="cancelBtn">취소</button>
                <button id="confirmBtn">확인</button>
            </div>
        </div>
    </div>
    <div id="footer"></div>
    <div id="toast" class="toast"></div>
    <script type="module" src="/page/my/my.js"></script>
    <script src="/config.js"></script>
</body>

</html>
