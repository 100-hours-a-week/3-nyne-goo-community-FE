<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원정보수정 | 아무 말 대잔치</title>
    <link rel="stylesheet" href="/common/css/common.css">
    <link rel="stylesheet" href="/page/my/my.css">
</head>

<body>
    <div id="wrap">
        <div id="header"></div>

        <div id="container">
            <div class="mypage-box">
                <h2>마이페이지</h2>

                <!-- 프로필 -->
                <div class="profile-section">
                    <div class="profile-circle">
                        <img src="/assets/image/default_profile.png" alt="프로필 이미지" id="profileImg">
                    </div>
                </div>

                <!-- 이메일, 닉네임 -->
                <div class="info-display">
                    <div class="info-row">
                        <p class="label">이메일</p>
                        <p class="value" id="emailValue"></p>
                    </div>

                    <div class="info-row">
                        <p class="label">닉네임</p>
                        <p class="value" id="nicknameValue"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="text/javascript" src="/page/my/my.js"></script>
    <script src="/config.js"></script>
</body>

</html>
