<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>비밀번호 수정 | 아무 말 대잔치</title>
  <link rel="stylesheet" href="/common/css/common.css">
  <link rel="stylesheet" href="/page/my/edit-password/edit-password.css">
</head>

<body>
  <div id="wrap">
    <div id="header"></div>

    <div id="container">
      <div class="mypage-box">
        <h2>비밀번호 수정</h2>

        <!-- 1단계: 현재 비밀번호 확인 -->
        <div id="step1" class="password-step">
          <div class="info-row">
            <label for="currentPassword" class="label">현재 비밀번호</label>
            <div class="password-input-wrapper">
              <input type="password" id="currentPassword" class="nickname-input" maxlength="20"
                placeholder="현재 비밀번호 입력" />
              <img src="/assets/image/ic_eye_closed_black_64.png" alt="비밀번호 보기" class="eye-icon" id="eyeCurrent">
            </div>
          </div>
          <p id="currentError" class="error-msg"></p>

          <div class="bottom-btns show">
            <button id="verifyBtn" class="save-btn">다음</button>
          </div>
        </div>

        <!-- 2단계: 새 비밀번호 설정 -->
        <div id="step2" class="password-step" style="display:none;">
          <div class="info-row">
            <label for="newPassword" class="label">새 비밀번호</label>
            <div class="password-input-wrapper">
              <input type="password" id="newPassword" class="nickname-input" maxlength="20" placeholder="새 비밀번호 입력" />
              <img src="/assets/image/ic_eye_closed_black_64.png" alt="비밀번호 보기" class="eye-icon" id="eyeNew">
            </div>
          </div>
          <p id="newError" class="error-msg"></p>

          <div class="info-row">
            <label for="confirmPassword" class="label">새 비밀번호 확인</label>
            <div class="password-input-wrapper">
              <input type="password" id="confirmPassword" class="nickname-input" maxlength="20"
                placeholder="새 비밀번호 다시 입력" />
              <img src="/assets/image/ic_eye_closed_black_64.png" alt="비밀번호 보기" class="eye-icon" id="eyeConfirm">
            </div>
          </div>
          <p id="confirmError" class="error-msg"></p>

          <div class="bottom-btns show">
            <button id="savePasswordBtn" class="save-btn">저장</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast">비밀번호가 성공적으로 변경되었습니다.</div>
  <script src="/config.js"></script>
  <script type="module" src="/page/my/edit-password/edit-password.js"></script>
</body>

</html>
